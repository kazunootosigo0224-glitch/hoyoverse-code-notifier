name: HoYoverse Code Notifier

on:
  schedule:
    - cron: '0 */6 * * *' # 6時間おきに実行
  workflow_dispatch:      # GitHub画面から手動実行も可能

jobs:
  check-codes:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動コミット権限を付与
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run notifier script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit and push if notified_codes.json changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add notified_codes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update notified_codes.json [skip ci]" && git push)
