name: HoYoverse Notifier

on:
  schedule:
    - cron: '*/30 * * * *' # 30分ごと（終了前リマインド用）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoyoverse-notifier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run notifier
        env:
          DISCORD_WEBHOOK_GENSHIN: ${{ secrets.DISCORD_WEBHOOK_GENSHIN }}
          DISCORD_WEBHOOK_HSR: ${{ secrets.DISCORD_WEBHOOK_HSR }}
        run: python main.py

      - name: Commit notification state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add notified_codes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update notifier state [skip ci]"
            git push
          fi
